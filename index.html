<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#fe2c55;--cyan:#25f4ee;--ink:#161823;--muted:#8a8b91;--line:#ebebef;--field:#f4f4f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fbfbfc;color:var(--ink);font-family:Manrope,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;overflow-x:hidden}
input::placeholder{color:var(--muted)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

/* background */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 18s ease-in-out infinite}
.glow.c{width:340px;height:340px;left:-120px;top:-100px;background:rgba(37,244,238,.28)}
.glow.r{width:360px;height:360px;right:-140px;bottom:-120px;background:rgba(254,44,85,.20);animation-delay:-9s}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(22,24,35,.07) 1px,transparent 1px);background-size:20px 20px;-webkit-mask:linear-gradient(#000,transparent 70%);mask:linear-gradient(#000,transparent 70%)}
.note-bg{position:absolute;width:64px;height:64px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(22,24,35,.06);display:flex;align-items:center;justify-content:center;animation:float 7s ease-in-out infinite}
.note-bg span{width:58%;height:58%;display:block}
.note-bg img{width:100%;height:100%;display:block;object-fit:contain;opacity:.22}

.screen{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:20px 16px 28px}
.hidden{display:none!important}
.card{background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(22,24,35,.05)}
.in{animation:in .45s cubic-bezier(.2,.8,.2,1) both}

/* start */
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:-3px 0 0 var(--cyan)}
.hero{margin-top:40px;padding:24px 20px}
.title{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.title span{color:var(--red);text-shadow:-2px 0 0 rgba(37,244,238,.6)}
.sub{margin-top:8px;font-size:15px;color:var(--muted)}
.field{margin-top:20px;display:flex;align-items:center;gap:4px;height:54px;padding:0 16px;border-radius:12px;background:var(--field);border:1.5px solid transparent;transition:border-color .2s,background .2s}
.field:focus-within{background:#fff;border-color:var(--ink)}
.field.err{border-color:var(--red);animation:nudge .3s}
.field .at{font-size:17px;font-weight:800;color:var(--muted)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 17px Manrope,sans-serif;color:var(--ink)}
.hint{margin-top:8px;font-size:13px;font-weight:600;color:var(--red);display:none}
.hint.show{display:block}
.label{margin-top:auto;padding:28px 4px 10px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{padding:14px;display:flex;flex-direction:column;gap:18px;cursor:pointer;opacity:.45;transition:opacity .2s,transform .15s,box-shadow .2s,border-color .2s}
.list.ok .row{opacity:1}
.list.ok .row:hover{transform:translateY(-2px);border-color:#d9d9de;box-shadow:0 14px 30px rgba(22,24,35,.08)}
.row:active{transform:scale(.97)!important}
.row img{width:44px;height:44px;border-radius:12px;object-fit:cover}
.row .b{display:flex;align-items:center;justify-content:space-between}
.row .name{font-size:15px;font-weight:800}
.row .arr{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}

/* tap */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px}
.top button{width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;transition:transform .15s}
.top button:active{transform:scale(.92)}
.top .nick{font-size:16px;font-weight:800}
.profile{margin-top:14px;padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center}
.ava{position:relative;width:100px;height:100px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,var(--cyan),#fff 30%,var(--red) 60%,#fff 85%,var(--cyan));animation:spin 8s linear infinite}
.ava .ph{width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid #fff;background:var(--field);animation:spin 8s linear infinite reverse}
.ava img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block}
.handle{margin-top:12px;font-size:17px;font-weight:800}
.platform{margin-top:8px;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--muted)}
.platform img{width:20px;height:20px;border-radius:6px;object-fit:cover}
.stats{margin-top:18px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:16px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.stat + .stat::before{content:"";position:absolute;left:0;top:4px;height:30px;width:1px;background:var(--line)}
.stat .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;transition:color .25s;display:inline-block}
.stat .v.on{color:var(--red)}
.stat .v.bump{animation:bump .25s ease-out}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.arena{position:relative;flex:1;min-height:300px;display:flex;align-items:center;justify-content:center}
.pad{position:relative;width:184px;height:184px}
.pad::before,.pad::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--cyan);opacity:.5;transform:translate(-3px,-2px)}
.pad::after{border-color:var(--red);transform:translate(3px,2px)}
.halo{position:absolute;inset:-28px;border-radius:50%;border:1px dashed #d6d6dc;animation:spin 30s linear infinite}
.tapbtn{position:absolute;inset:0;z-index:1;border-radius:50%;background:#fff;box-shadow:0 14px 40px rgba(22,24,35,.12),inset 0 -4px 10px rgba(22,24,35,.04);display:flex;align-items:center;justify-content:center;touch-action:manipulation;transition:transform .1s ease-out,box-shadow .1s}
.tapbtn.down{transform:scale(.94);box-shadow:0 6px 18px rgba(22,24,35,.12)}
.tapbtn .note{width:84px;height:84px;pointer-events:none;display:block;filter:drop-shadow(-3px -2px 0 #25f4ee) drop-shadow(3px 2px 0 #fe2c55)}
.tapbtn img{width:100%;height:100%;object-fit:contain;display:block}
.ripple{position:absolute;inset:0;border-radius:50%;border:2px solid var(--red);animation:ripple .6s ease-out forwards;pointer-events:none}
.ripple.c{border-color:var(--cyan);animation-delay:.06s}
.plus{position:absolute;left:50%;top:50%;z-index:2;font-weight:800;font-size:18px;color:var(--ink);white-space:nowrap;pointer-events:none;animation:plus .9s ease-out forwards}
.plus b{color:var(--red)}
.tip{text-align:center;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.tip i{width:6px;height:6px;border-radius:50%;background:var(--red);animation:blink 1.4s ease-in-out infinite}

@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--rt,0deg))}50%{transform:translateY(-10px) rotate(var(--rt,0deg))}}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes ripple{from{transform:scale(1);opacity:.6}to{transform:scale(1.35);opacity:0}}
@keyframes plus{0%{transform:translate(-50%,-50%) scale(.8);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-180px) scale(1);opacity:0}}
@keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes blink{50%{opacity:.25}}

.fn{position:absolute;aspect-ratio:1;border-radius:22%;overflow:hidden;opacity:.55;box-shadow:0 10px 24px rgba(22,24,35,.12);animation:float 8s ease-in-out infinite}
.fn img{width:100%;height:100%;object-fit:cover;transform:scale(1.15);display:block}
.fn.sm{opacity:.4}
/* icons (pure css) */
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;position:relative}
.ic-heart{color:var(--red);font-size:15px;line-height:1}
.ic-heart::before{content:"\2665"}
.ic-user{width:14px;height:14px}
.ic-user::before{content:"";position:absolute;top:0;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:currentColor}
.ic-user::after{content:"";position:absolute;bottom:0;left:50%;width:12px;height:6px;margin-left:-6px;border-radius:6px 6px 2px 2px;background:currentColor}
.ic-msg{width:14px;height:11px;border-radius:4px;background:currentColor;margin-bottom:2px}
.ic-msg::after{content:"";position:absolute;left:3px;bottom:-3px;border:3px solid transparent;border-top-color:currentColor;border-left-color:currentColor}
.ic-play{width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.ic-dot{width:6px;height:6px;border-radius:50%;background:var(--red)}
.chip{position:absolute;display:flex;align-items:center;gap:7px;padding:8px 12px 8px 8px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(22,24,35,.06);font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;animation:float 8s ease-in-out infinite;opacity:.75}
.chip .bub{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.chip .bub.r{background:var(--red)}
.chip .bub.k{background:var(--ink)}
.chip .bub.c{background:var(--cyan);color:var(--ink)}
.chip .bub .ic-heart{color:#fff;font-size:12px}
.chip .bub .ic-user,.chip .bub .ic-msg{transform:scale(.8)}
.chip small{color:var(--muted);font-weight:700}
.heart-bg{position:absolute;color:var(--red);opacity:.14;animation:float 9s ease-in-out infinite}
.heart-bg::before{content:"\2665"}
.stat .ico{height:18px;display:flex;align-items:center;color:var(--muted);margin-bottom:2px}
.stat .v.on + .l, .stat .ico.on{color:var(--red)}
.fheart{position:absolute;left:50%;top:50%;color:var(--red);pointer-events:none;animation:fheart 1.1s ease-out forwards;font-size:var(--s)}
.fheart::before{content:"\2665"}
@keyframes fheart{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}20%{opacity:.9}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--r));opacity:0}}
@media (max-width:520px){.chip.wide{display:none}}
</style>
</head>
<body>

<div class="bg">
  <div class="glow c"></div>
  <div class="glow r"></div>
  <div class="grid"></div>
  <span class="fn" style="left:6%;top:8%;width:58px;--rt:-12deg"><img class="bgLogo" data-k="tiktok" alt=""></span>
  <span class="fn" style="right:7%;top:14%;width:66px;--rt:10deg;animation-delay:-3s"><img class="bgLogo" data-k="instagram" alt=""></span>
  <span class="fn" style="left:8%;top:62%;width:50px;--rt:8deg;animation-delay:-5s"><img class="bgLogo" data-k="youtube" alt=""></span>
  <span class="fn" style="right:6%;top:70%;width:56px;--rt:-14deg;animation-delay:-1s"><img class="bgLogo" data-k="twitch" alt=""></span>
  <span class="fn sm" style="right:28%;bottom:4%;width:36px;--rt:16deg;animation-delay:-6s"><img class="bgLogo" data-k="tiktok" alt=""></span>
  <div class="chip" style="left:3%;top:24%;animation-delay:-2s"><span class="bub r"><i class="ic ic-heart"></i></span>+24.5K <small>likes</small></div>
  <div class="chip" style="right:3%;top:40%;animation-delay:-5s"><span class="bub k"><i class="ic ic-user"></i></span>+1.2K <small>followers</small></div>
  <div class="chip wide" style="left:4%;top:46%;animation-delay:-1s"><span class="bub c"><i class="ic ic-msg"></i></span>348 <small>comments</small></div>
  <div class="chip wide" style="left:6%;bottom:6%;animation-delay:-4s"><span class="bub k"><i class="ic ic-play"></i></span>2.1M <small>views</small></div>
  <div class="heart-bg" style="left:22%;top:34%;font-size:30px;animation-delay:-3s"></div>
  <div class="heart-bg" style="right:20%;top:30%;font-size:20px;animation-delay:-6s"></div>
  <div class="heart-bg" style="left:46%;bottom:14%;font-size:24px;animation-delay:-1s"></div>
</div>

<section id="start" class="screen">
  <div class="brand in"><span class="dot"></span>Tapper</div>
  <div class="card hero in" style="animation-delay:.05s">
    <div class="title">Enter your <span>nickname</span></div>
    <div class="sub">It will appear on your profile</div>
    <div class="field" id="field">
      <span class="at">@</span>
      <input id="nick" placeholder="nickname" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="hint" id="hint">Enter a nickname first</div>
  </div>
  <div class="label in" style="animation-delay:.1s">Choose platform</div>
  <div class="list" id="list"></div>
</section>

<section id="tap" class="screen hidden">
  <div class="top in">
    <button id="back">‹</button>
    <div class="nick" id="topNick"></div>
    <button id="reset" style="font-size:17px">↺</button>
  </div>
  <div class="card profile in" style="animation-delay:.05s">
    <div class="ava"><div class="ph"><img id="avaImg" alt="avatar"></div></div>
    <div class="handle" id="handle"></div>
    <div class="platform"><img id="pImg" alt=""><span id="pName"></span></div>
    <div class="stats">
      <div class="stat"><div class="ico"><i class="ic ic-user"></i></div><div class="v">0</div><div class="l">Following</div></div>
      <div class="stat"><div class="ico" id="icoF"><i class="ic ic-user"></i></div><div class="v" id="followers">0</div><div class="l">Followers</div></div>
      <div class="stat"><div class="ico" id="icoL"><i class="ic ic-heart" style="color:inherit"></i></div><div class="v" id="likes">0</div><div class="l" id="likesLabel">Likes</div></div>
    </div>
  </div>
  <div class="arena in" style="animation-delay:.1s" id="arena">
    <div class="pad" id="pad">
      <div class="halo"></div>
      <button class="tapbtn" id="tapbtn"><span class="note"><img id="tapImg" alt="tap" draggable="false"></span></button>
    </div>
  </div>
  <div class="tip"><i></i>Tap the button</div>
</section>

document.querySelectorAll('.bgLogo').forEach(i => i.src = IMG[i.dataset.k]);

<script>
const PLATFORMS = [
  { name:'TikTok',    img:IMG.tiktok,    label:'Likes' },
  { name:'Instagram', img:IMG.instagram, label:'Likes' },
  { name:'YouTube',   img:IMG.youtube,   label:'Views' },
  { name:'Twitch',    img:IMG.twitch,    label:'Viewers' },
];
const S = { nick:'', likes:0, followers:0 };
const $ = id => document.getElementById(id);
const fmt = n => n>=1e9 ? (n/1e9).toFixed(1).replace(/\.0$/,'')+'B'
              : n>=1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'')+'M'
              : n>=1e3 ? (n/1e3).toFixed(1).replace(/\.0$/,'')+'K' : String(n);
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

const list = $('list'), field = $('field'), hint = $('hint'), nickInput = $('nick');
PLATFORMS.forEach((p, i) => {
  const r = document.createElement('div');
  r.className = 'card row in';
  r.style.animationDelay = (0.15 + i * 0.05) + 's';
  r.innerHTML = '<img src="' + p.img + '" alt=""><div class="b"><div class="name">' + p.name + '</div><div class="arr">→</div></div>';
  r.onclick = () => open(p);
  list.appendChild(r);
});

nickInput.addEventListener('input', () => {
  nickInput.value = nickInput.value.replace(/[@\s]/g, '');
  S.nick = nickInput.value;
  field.classList.remove('err');
  hint.classList.remove('show');
  list.classList.toggle('ok', S.nick.length > 0);
});

function open(p) {
  if (!S.nick) { replay(field, 'err'); hint.classList.add('show'); nickInput.focus(); return; }
  $('topNick').textContent = S.nick;
  $('handle').textContent = '@' + S.nick;
  $('pImg').src = p.img;
  $('pName').textContent = p.name;
  $('likesLabel').textContent = p.label;
  $('start').classList.add('hidden');
  $('tap').classList.remove('hidden');
  render();
}

$('back').onclick = () => { $('tap').classList.add('hidden'); $('start').classList.remove('hidden'); };
$('reset').onclick = () => { S.likes = 0; S.followers = 0; render(); };

const btn = $('tapbtn'), pad = $('pad');
btn.addEventListener('pointerdown', e => {
  e.preventDefault();
  btn.classList.add('down');
  const addL = Math.round(15000 + Math.random() * 90000);
  const addF = Math.round(200 + Math.random() * 2500);
  S.likes += addL; S.followers += addF;

  ['', 'c'].forEach(c => {
    const r = document.createElement('div'); r.className = 'ripple ' + c;
    pad.appendChild(r); setTimeout(() => r.remove(), 700);
  });
  const p = document.createElement('div'); p.className = 'plus';
  p.style.setProperty('--dx', ((Math.random() - .5) * 80) + 'px');
  p.innerHTML = '<b>+' + fmt(addL) + '</b>';
  pad.appendChild(p); setTimeout(() => p.remove(), 950);
  for (let i = 0; i < 3; i++) {
    const h = document.createElement('div'); h.className = 'fheart';
    const side = i % 2 ? 1 : -1;
    h.style.setProperty('--dx', (side * (70 + Math.random() * 60)) + 'px');
    h.style.setProperty('--dy', (-60 - Math.random() * 110) + 'px');
    h.style.setProperty('--r', (side * Math.random() * 30) + 'deg');
    h.style.setProperty('--s', (14 + Math.random() * 12) + 'px');
    pad.appendChild(h); setTimeout(() => h.remove(), 1150);
  }

  if (navigator.vibrate) navigator.vibrate(8);
  render(true);
});
['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, () => btn.classList.remove('down')));

function render(tapped) {
  const L = $('likes'), F = $('followers');
  L.textContent = fmt(S.likes);
  F.textContent = fmt(S.followers);
  L.classList.toggle('on', S.likes > 0);
  F.classList.toggle('on', S.followers > 0);
  $('icoL').classList.toggle('on', S.likes > 0);
  $('icoF').classList.toggle('on', S.followers > 0);
  if (tapped) { replay(L, 'bump'); replay(F, 'bump'); }
}
</script>
